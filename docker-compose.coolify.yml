# Scoutfile production on Coolify — kept so it can be stopped and started again after the EC2
# host is retired. Read deploy/coolify/README.md first.
#
# Build pack "Docker Compose", compose file /docker-compose.coolify.yml, branch master.
# Domains go on `scoutfile-web` only (port 8000). Static and media stay on S3 + CloudFront.
#
# Every service name starts with `scoutfile-`: each stack on the server can reach the shared
# `coolify` network, where Docker answers a service name with that service of EVERY stack, so a
# generic `web` or `redis` would be answered by another app's container (volunhub #5698).
#
# The database lives in this stack, so stopping the application stops everything and frees
# its memory; the `scoutfile-db-data` volume keeps the data for the next start.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    POSTGRES_HOST: scoutfile-db
    POSTGRES_DB: scoutfile
    POSTGRES_USER: scoutfile
    POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    MEMCACHED_LOCATION: scoutfile-memcached:11211
    REDIS_CACHE_URL: redis://scoutfile-redis:6379/1
    CELERY_BROKER_URL: redis://scoutfile-redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-scoutfile.albascout.ro,centru.albascout.ro,knowledge.albascout.ro}
    # Generated by Coolify. settings.py's key is public (the repository is); nothing stores a
    # value derived from it that is recomputed later, so a new key only ends open sessions.
    DJANGO_SECRET_KEY: ${SERVICE_BASE64_64_DJANGOSECRET}
    # The EC2 host's web/scoutfile3/local_settings.py and keys/scoutfile-2023.pem, base64-encoded
    # (`base64 -w0 <file>`). Organizer accepts tokens signed with that key.
    SCOUTFILE_LOCAL_SETTINGS_B64: ${SCOUTFILE_LOCAL_SETTINGS_B64}
    SCOUTFILE_JWT_KEY_B64: ${SCOUTFILE_JWT_KEY_B64}
  depends_on:
    scoutfile-db:
      condition: service_healthy
    scoutfile-redis:
      condition: service_started
    scoutfile-memcached:
      condition: service_started

services:
  scoutfile-migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    # A one-shot: exiting 0 is success. On an empty database it skips (restore the dump first).
    exclude_from_hc: true

  scoutfile-web:
    <<: *app
    command: ["web"]
    depends_on:
      scoutfile-migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 is always allowed (settings_docker.py); it falls through to the default host.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  scoutfile-worker:
    <<: *app
    command: ["worker"]
    depends_on:
      scoutfile-migrate:
        condition: service_completed_successfully
    exclude_from_hc: true

  scoutfile-db:
    # PostgreSQL 14 = the version the EC2 host's dumps come from.
    image: postgis/postgis:14-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoutfile
      POSTGRES_USER: scoutfile
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - scoutfile-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutfile -d scoutfile"]
      interval: 10s
      timeout: 5s
      retries: 10

  scoutfile-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  scoutfile-memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["memcached", "-m", "64"]

volumes:
  scoutfile-db-data:
